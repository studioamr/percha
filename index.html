<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERCHA · Ropa seminueva y nueva</title>
<meta name="description" content="Ropa seminueva y nueva a precios de oferta. Aparta por WhatsApp.">
<meta name="theme-color" content="#F4F1EA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --hueso:#F4F1EA; --tinta:#1C1A17; --tinta-suave:#6B655C;
    --linea:#E2DDD2; --terracota:#B84A1E; --blanco:#FFFDF9;
    --verde:#2E5E45;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--hueso);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  .serif{font-family:'Fraunces',Georgia,serif}

  header{padding:28px 20px 18px;border-bottom:1px solid var(--linea)}
  .marca{font-family:'Fraunces',serif;font-weight:700;font-size:34px;letter-spacing:.06em}
  .marca span{color:var(--terracota)}
  .sub{color:var(--tinta-suave);font-size:13px;margin-top:4px;letter-spacing:.02em}
  .meta-linea{color:var(--tinta-suave);font-size:12px;margin-top:10px}

  .filtros{position:sticky;top:0;background:var(--hueso);z-index:10;border-bottom:1px solid var(--linea);padding:12px 20px}
  .fila-busca{display:flex;gap:8px}
  .fila-busca input{flex:1;border:1px solid var(--linea);background:var(--blanco);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit;color:var(--tinta);outline:none}
  .fila-busca input:focus{border-color:var(--tinta)}
  .fila-sel{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .fila-sel::-webkit-scrollbar{display:none}
  .fila-sel select{border:1px solid var(--linea);background:var(--blanco);border-radius:999px;padding:7px 12px;font-size:13px;font-family:inherit;color:var(--tinta);outline:none;flex-shrink:0;appearance:none;-webkit-appearance:none}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--linea);background:transparent;color:var(--tinta-suave);border-radius:999px;padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;flex-shrink:0;transition:all .15s}
  .chip.on{background:var(--tinta);color:var(--hueso);border-color:var(--tinta)}

  main{padding:20px;max-width:1200px;margin:0 auto}
  .cuenta{color:var(--tinta-suave);font-size:13px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card .foto{position:relative;aspect-ratio:3/4;background:#EAE6DC}
  .card .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .badge-off{position:absolute;top:8px;left:8px;background:var(--terracota);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;letter-spacing:.03em}
  .badge-apartada{position:absolute;inset:0;background:rgba(28,26,23,.55);display:flex;align-items:center;justify-content:center}
  .badge-apartada span{background:var(--hueso);color:var(--tinta);font-size:12px;font-weight:700;letter-spacing:.14em;padding:6px 14px;border-radius:6px}
  .card .info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .card .titulo{font-size:14px;font-weight:600;line-height:1.3}
  .card .detalle{font-size:12px;color:var(--tinta-suave)}
  .card .etq{font-size:10px;color:var(--tinta-suave);letter-spacing:.08em}
  .precios{display:flex;align-items:baseline;gap:8px;margin-top:4px}
  .precio{font-family:'Fraunces',serif;font-size:20px;font-weight:700}
  .original{font-size:13px;color:var(--tinta-suave);text-decoration:line-through}
  .btn-wa{margin-top:10px;border:none;background:var(--verde);color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:11px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
  .btn-wa:active{transform:scale(.98)}
  .btn-wa.off{background:var(--linea);color:var(--tinta-suave);pointer-events:none}
  .btn-wa svg{width:16px;height:16px;fill:currentColor}

  .vacio{text-align:center;padding:80px 20px;color:var(--tinta-suave)}
  .vacio .serif{font-size:26px;color:var(--tinta);margin-bottom:10px}

  footer{padding:40px 20px 60px;text-align:center;color:var(--tinta-suave);font-size:12px;border-top:1px solid var(--linea);margin-top:40px}
</style>
</head>
<body>

<header>
  <div class="marca">PERCHA<span>.</span></div>
  <div class="sub" id="subtitulo">Ropa seminueva y nueva</div>
  <div class="meta-linea" id="metaLinea"></div>
</header>

<div class="filtros" id="filtros" hidden>
  <div class="fila-busca">
    <input type="search" id="busca" placeholder="Buscar marca, prenda, #etiqueta…">
  </div>
  <div class="chips" id="chipsSeccion"></div>
  <div class="fila-sel">
    <select id="selCategoria"><option value="">Categoría</option></select>
    <select id="selTalla"><option value="">Talla</option></select>
    <select id="selMarca"><option value="">Marca</option></select>
    <select id="selOrden">
      <option value="recientes">Recientes</option>
      <option value="menor">Menor precio</option>
      <option value="mayor">Mayor precio</option>
      <option value="descuento">Mayor descuento</option>
    </select>
  </div>
</div>

<main>
  <div class="cuenta" id="cuenta"></div>
  <div class="grid" id="grid"></div>
  <div class="vacio" id="vacio" hidden>
    <div class="serif">Estamos colgando las primeras prendas</div>
    <div>Muy pronto verás aquí todo el catálogo.<br>Guarda esta página.</div>
  </div>
</main>

<footer>PERCHA · Aparta por WhatsApp · La prenda se entrega embolsada y etiquetada</footer>

<script>
const $=id=>document.getElementById(id);
const mx=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
let DATA=null, F={q:'',seccion:'',categoria:'',talla:'',marca:'',orden:'recientes'};

const WA_SVG='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.4-.7-2.9-1.1-4.7-4-4.9-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c0 .2.1.4 0 .6l-.4.6-.5.5c-.1.2-.3.3-.1.6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.3 1.4 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2.2 1c.3.2.5.3.6.4 0 .1 0 .7-.2 1.3z"/></svg>';

async function cargar(){
  try{
    const r=await fetch('catalogo.json?v='+Date.now());
    DATA=await r.json();
  }catch(e){ DATA={prendas:[]}; }
  if(DATA.subtitulo) $('subtitulo').textContent=DATA.subtitulo;
  const disp=(DATA.prendas||[]).filter(p=>p.status!=='vendida');
  if(!disp.length){ $('vacio').hidden=false; $('cuenta').hidden=true; return; }
  $('filtros').hidden=false;
  poblarFiltros(disp);
  render();
}

function poblarFiltros(prendas){
  const secciones=[...new Set(prendas.map(p=>p.seccion).filter(Boolean))];
  const cats=[...new Set(prendas.map(p=>p.categoria).filter(Boolean))].sort();
  const tallas=[...new Set(prendas.map(p=>p.talla).filter(Boolean))].sort();
  const marcas=[...new Set(prendas.map(p=>p.marca).filter(Boolean))].sort();
  const chips=$('chipsSeccion');
  chips.innerHTML='';
  const todos=document.createElement('button');
  todos.className='chip on'; todos.textContent='Todo';
  todos.onclick=()=>{F.seccion='';marcarChip(todos);render();};
  chips.appendChild(todos);
  secciones.forEach(s=>{
    const b=document.createElement('button');
    b.className='chip'; b.textContent=s;
    b.onclick=()=>{F.seccion=s;marcarChip(b);render();};
    chips.appendChild(b);
  });
  cats.forEach(c=>$('selCategoria').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
  tallas.forEach(t=>$('selTalla').insertAdjacentHTML('beforeend',`<option>${t}</option>`));
  marcas.forEach(m=>$('selMarca').insertAdjacentHTML('beforeend',`<option>${m}</option>`));
}
function marcarChip(el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
}

$('busca').addEventListener('input',e=>{F.q=e.target.value.toLowerCase();render();});
$('selCategoria').addEventListener('change',e=>{F.categoria=e.target.value;render();});
$('selTalla').addEventListener('change',e=>{F.talla=e.target.value;render();});
$('selMarca').addEventListener('change',e=>{F.marca=e.target.value;render();});
$('selOrden').addEventListener('change',e=>{F.orden=e.target.value;render();});

function render(){
  let lista=(DATA.prendas||[]).filter(p=>p.status!=='vendida');
  if(F.seccion) lista=lista.filter(p=>p.seccion===F.seccion);
  if(F.categoria) lista=lista.filter(p=>p.categoria===F.categoria);
  if(F.talla) lista=lista.filter(p=>p.talla===F.talla);
  if(F.marca) lista=lista.filter(p=>p.marca===F.marca);
  if(F.q) lista=lista.filter(p=>(p.titulo+' '+(p.marca||'')+' #'+p.etiqueta).toLowerCase().includes(F.q));
  if(F.orden==='menor') lista.sort((a,b)=>a.precio-b.precio);
  else if(F.orden==='mayor') lista.sort((a,b)=>b.precio-a.precio);
  else if(F.orden==='descuento') lista.sort((a,b)=>desc(b)-desc(a));
  else lista.sort((a,b)=>(b.creada||0)-(a.creada||0));

  $('cuenta').textContent=lista.length+' prenda'+(lista.length===1?'':'s');
  const grid=$('grid');
  grid.innerHTML='';
  lista.forEach(p=>grid.appendChild(card(p)));
}

function desc(p){ return p.precioOriginal>p.precio ? Math.round((1-p.precio/p.precioOriginal)*100) : 0; }

function card(p){
  const d=desc(p);
  const apartada=p.status==='apartada';
  const el=document.createElement('div');
  el.className='card';
  const detalle=[p.marca,p.talla?'Talla '+p.talla:null,p.estado].filter(Boolean).join(' · ');
  el.innerHTML=`
    <div class="foto">
      <img src="${p.foto}" alt="${esc(p.titulo)}" loading="lazy">
      ${d>0?`<div class="badge-off">−${d}%</div>`:''}
      ${apartada?'<div class="badge-apartada"><span>APARTADA</span></div>':''}
    </div>
    <div class="info">
      <div class="etq">#${p.etiqueta}</div>
      <div class="titulo">${esc(p.titulo)}</div>
      <div class="detalle">${esc(detalle)}</div>
      <div class="precios">
        <span class="precio">${mx.format(p.precio)}</span>
        ${p.precioOriginal>p.precio?`<span class="original">${mx.format(p.precioOriginal)}</span>`:''}
      </div>
      ${botonWA(p,apartada)}
    </div>`;
  return el;
}

function botonWA(p,apartada){
  if(apartada) return `<span class="btn-wa off">Apartada</span>`;
  const num=(DATA.whatsapp||'').replace(/\D/g,'');
  const msg=encodeURIComponent(`Hola! Quiero la prenda #${p.etiqueta} — ${p.titulo}${p.talla?', talla '+p.talla:''}, ${mx.format(p.precio)}. ¿Sigue disponible?`);
  if(!num) return '';
  return `<a class="btn-wa" href="https://wa.me/${num}?text=${msg}" target="_blank" rel="noopener">${WA_SVG} Lo quiero</a>`;
}

function esc(s){ return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

cargar();
</script>
</body>
</html>
